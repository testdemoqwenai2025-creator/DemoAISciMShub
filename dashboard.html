<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Dashboard — OSIRIS</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #0a0a0f; --fg: #e5e7eb; --primary: #3b82f6; --emerald: #22c55e; --muted: #9ca3af; --border: #1f2937; }
html { color-scheme: dark; }
body { background: var(--bg); color: var(--fg); font-family: ui-sans-serif, system-ui, sans-serif; min-height: 100vh; }
a { color: var(--primary); text-decoration: none; }
.nav { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.nav-brand { font-weight: 800; font-size: 16px; }
.nav-brand .aurora { background: linear-gradient(90deg, #3b82f6, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.nav-links { display: flex; gap: 12px; font-size: 12px; }
.nav-links a { color: var(--muted); }
.container { max-width: 800px; margin: 0 auto; padding: 24px 16px; }
.hero { text-align: center; margin-bottom: 24px; }
.hero h1 { font-size: 2rem; font-weight: 800; }
.hero h1 .aurora { background: linear-gradient(90deg, #3b82f6, #06b6d4, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.hero p { color: var(--muted); margin-top: 8px; }
.stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 24px 0; }
.stat-card { border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; background: rgba(31,41,55,0.3); }
.stat-card h4 { font-size: 10px; text-transform: uppercase; color: var(--muted); font-family: monospace; }
.stat-card .value { font-size: 28px; font-weight: 800; font-family: monospace; color: var(--primary); margin-top: 8px; }
.btn { padding: 12px 24px; border: none; border-radius: 8px; background: var(--primary); color: white; font-weight: 700; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; }
.btn:hover { filter: brightness(1.15); transform: scale(1.02); }
.analysis-list { margin-top: 24px; }
.analysis-item { border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; background: rgba(31,41,55,0.3); display: flex; align-items: center; gap: 16px; }
.analysis-thumb { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); flex-shrink: 0; }
.analysis-info { flex: 1; }
.analysis-name { font-size: 14px; font-weight: 600; }
.analysis-meta { font-size: 11px; color: var(--muted); font-family: monospace; margin-top: 4px; }
.analysis-cert { font-size: 11px; color: var(--emerald); font-family: monospace; margin-top: 4px; }
.empty { text-align: center; padding: 48px; color: var(--muted); }
.empty-icon { font-size: 48px; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="nav">
  <div class="nav-brand"><span class="aurora">OSIRIS</span> · Dashboard</div>
  <div class="nav-links">
    <a href="/DemoAISciMShub/analyze">Analyze</a>
    <a href="/DemoAISciMShub/killer-demo">Demo</a>
    <a href="/DemoAISciMShub/shorts">Shorts</a>
    <a href="/DemoAISciMShub/login" onclick="localStorage.removeItem('osiris_user')">Logout</a>
  </div>
  <div style="font-size:12px;color:var(--muted);font-family:monospace;" id="navUser"></div>
</div>

<div class="container">
  <div class="hero">
    <h1><span class="aurora">Your dashboard</span></h1>
    <p>Welcome back. Your analyses and Theorem 7 certificates are stored here.</p>
  </div>

  <div class="stats">
    <div class="stat-card"><h4>Analyses</h4><div class="value" id="statAnalyses">0</div></div>
    <div class="stat-card"><h4>Certified</h4><div class="value" id="statCertified">0</div></div>
    <div class="stat-card"><h4>Member since</h4><div class="value" id="statSince" style="font-size:16px;">—</div></div>
  </div>

  <div style="text-align:center;margin:24px 0;">
    <a href="/DemoAISciMShub/analyze" class="btn">+ New analysis</a>
  </div>

  <div class="analysis-list" id="analysisList">
    <div class="empty" id="emptyState">
      <div class="empty-icon">📊</div>
      <p>No analyses yet. Click "New analysis" to upload an image and run OSIRIS.</p>
    </div>
  </div>
</div>

<script>
var user = JSON.parse(localStorage.getItem('osiris_user') || 'null');
if (!user) { window.location.href = '/DemoAISciMShub/login'; }
document.getElementById('navUser').textContent = user.name + ' · ' + user.email;
document.getElementById('statSince').textContent = user.email ? 'Today' : '—';

// Load analyses from IndexedDB
var db;
var req = indexedDB.open('osiris_db', 1);
req.onupgradeneeded = function(e) {
  var d = e.target.result;
  if (!d.objectStoreNames.contains('users')) d.createObjectStore('users', { keyPath: 'email' });
  if (!d.objectStoreNames.contains('analyses')) d.createObjectStore('analyses', { keyPath: 'id', autoIncrement: true });
};
req.onsuccess = function(e) {
  db = e.target.result;
  var tx = db.transaction('analyses', 'readonly');
  var store = tx.objectStore('analyses');
  var allReq = store.getAll();
  allReq.onsuccess = function(e) {
    var analyses = e.target.result.filter(function(a) { return a.userId === user.email; });
    document.getElementById('statAnalyses').textContent = analyses.length;
    document.getElementById('statCertified').textContent = analyses.length;
    if (analyses.length === 0) return;
    document.getElementById('emptyState').style.display = 'none';
    var list = document.getElementById('analysisList');
    list.innerHTML = '';
    analyses.reverse().forEach(function(a) {
      var item = document.createElement('div');
      item.className = 'analysis-item';
      item.innerHTML =
        '<img class="analysis-thumb" src="' + (a.imageSrc || '') + '" alt="' + a.imageName + '" onerror="this.style.display=\'none\'" />' +
        '<div class="analysis-info">' +
        '<div class="analysis-name">' + a.imageName + '</div>' +
        '<div class="analysis-meta">L=' + a.params.L + ' · c=' + a.params.c + ' · N=' + a.params.N + ' · ' + new Date(a.timestamp).toLocaleString() + '</div>' +
        '<div class="analysis-cert">✓ Theorem 7: bound=' + a.results.bound + ' · disp=' + a.results.displacement + ' · ' + a.results.compliance + '</div>' +
        '</div>';
      list.appendChild(item);
    });
  };
};
</script>
</body>
</html>
